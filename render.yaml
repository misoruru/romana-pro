services:
  - type: web
    name: romana-pro-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/romana.db
